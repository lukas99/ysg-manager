<ysg-progress-bar
  [showProgress]="loadingIndicator.isLoading"
></ysg-progress-bar>
<ysg-mobile-page-title (backClicked)="navigateBack()">
  {{ 'SKILLS_ON_ICE_TEAM_SELECTION' | translate }}
</ysg-mobile-page-title>
@for (team of teams(); track team) {
<mat-card (click)="teamSelected(team)">
  <mat-card-title>
    {{ team.name }}
  </mat-card-title>
</mat-card>
}
