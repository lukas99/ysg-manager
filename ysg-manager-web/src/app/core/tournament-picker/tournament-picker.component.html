@if (isEditable()) {
<button mat-button [matMenuTriggerFor]="tournamentPicker">
  {{ selectedTournamentName() }}
  <mat-icon>arrow_drop_down</mat-icon>
</button>
<mat-menu #tournamentPicker="matMenu">
  @for (tournament of tournaments(); track tournament) {
  <button mat-menu-item (click)="useTournament(tournament)">
    {{ tournament.name }}
  </button>
  }
</mat-menu>
} @else {
<button mat-button>
  {{ selectedTournamentName() }}
</button>
}
